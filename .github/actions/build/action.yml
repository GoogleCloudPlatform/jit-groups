name: Build
inputs:
  version:
    required: true
    default: '1.0'
  source-dir:
    required: true
    default: sources  
runs:
  using: "composite"
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@v3
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'
        
    - name: Set version
      run: mvn versions:set -DnewVersion=${INPUTS_VERSION}.${{ github.run_number }} --file ${INPUTS_SOURCE_DIR}/pom.xml
      shell: bash
      env:
        INPUTS_VERSION: ${{ inputs.version }}
        INPUTS_SOURCE_DIR: ${{ inputs.source-dir }}
      
    - name: Build
      # Run unit tests, but skip integration tests.
      run: mvn -P release -B test -DskipITs=true --file ${INPUTS_SOURCE_DIR}/pom.xml
      shell: bash
      env:
        INPUTS_SOURCE_DIR: ${{ inputs.source-dir }}
